[workspace]
members = ["cargo:."]

# `dist` is the pinned release planner. Xana-owned installers remain reviewed
# source files and are attached by the release workflow rather than generated.
[dist]
cargo-dist-version = "0.32.0"
# Xana owns a stricter no-publish/draft-only workflow. Keep cargo-dist as the
# planner and builder without asking it to replace that reviewed CI file.
allow-dirty = ["ci"]
packages = ["xana"]
display-name = "Xana"
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]
ci = "github"
hosting = "github"
installers = []
checksum = "sha256"
source-tarball = false
unix-archive = ".tar.gz"
windows-archive = ".zip"
auto-includes = false
include = ["LICENSE", "README.md", "docs/user/installation.md"]
github-attestations = true
github-attestations-filters = ["*.tar.gz", "*.zip", "dist-manifest.json"]
