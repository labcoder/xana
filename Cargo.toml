[workspace]
members = ["crates/xana-core", "crates/xana-cli"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/labcoder/xana"

[package]
name = "xana-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A small, extensible personal AI agent harness written in Rust"
license = "MIT"
repository = "https://github.com/labcoder/xana"
readme = "README.md"
keywords = ["ai", "agent", "cli", "automation"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[features]
default = ["documents-csv"]
documents-csv = ["dep:csv"]

[[bin]]
name = "xana"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
anyhow = "1.0.104"
atomic-write-file = "0.3.0"
base64 = "0.22.1"
blake3 = "1.8.3"
clap = { version = "4.6.6", features = ["derive"] }
csv = { version = "1.4.0", optional = true }
directories = "6.0.0"
futures = "0.3.31"
keyring = "4.1.6"
reqwest = { version = "0.13.4", features = ["json", "rustls", "stream"] }
rpassword = "7.5.4"
rustyline = "18.0.1"
xana-core = { version = "0.2.0", path = "crates/xana-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.48.0", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "1.1.4"
toml_edit = "0.25.13"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.27.0"
