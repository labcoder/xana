[workspace]
resolver = "3"
members = ["crates/xana-desktop"]
default-members = ["."]
exclude = ["vendor/libsqlite3-sys"]

[patch.crates-io]
# The published wrapper bundles an older cipher; see vendor/libsqlite3-sys/README.xana.md.
libsqlite3-sys = { path = "vendor/libsqlite3-sys" }

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/labcoder/xana"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", features = ["profiler"] }
gpui-ai = { git = "https://github.com/labcoder/gpui-ai", rev = "40ec5cf4e8b28f94b8fbbb4cb2f90d177c946039" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "5cb094628d27acbd557a1c22fd830417a702f0e5" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "5cb094628d27acbd557a1c22fd830417a702f0e5" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "runtime_shaders",
    "wayland",
    "x11",
] }
markdown = "1.0.0"
url = "2.5.8"

[package]
name = "xana"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A small, extensible personal AI agent harness written in Rust"
license = "MIT"
repository = "https://github.com/labcoder/xana"
readme = "README.md"
keywords = ["ai", "agent", "cli", "automation"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[package.metadata.dist]
# Prebuilt archives are an explicit product path even though crates.io
# publication remains disabled.
dist = true

[features]
default = ["documents-csv"]
documents-csv = ["dep:csv"]

[[bin]]
name = "xana"
path = "src/main.rs"

[dependencies]
age = { version = "=0.12.1", default-features = false }
anstream = "1.0.0"
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
atomic-write-file = "0.3.0"
base64 = "0.22.1"
blake3 = "1.8.3"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
csv = { version = "1.4.0", optional = true }
directories = "6.0.0"
futures = { version = "0.3.31", default-features = false, features = ["std"] }
jiff = { version = "=0.2.35", default-features = false, features = ["std", "tzdb-bundle-always"] }
fs2 = "0.4.3"
getrandom = "0.3.4"
globset = "0.4.20"
html2text = { version = "0.17.1", default-features = false }
ignore = "0.4.33"
keyring = "4.1.6"
keyring-core = "=1.0.0"
image = { version = "0.25.9", default-features = false, features = ["gif", "jpeg", "png"] }
reqwest = { version = "0.13.4", default-features = false, features = ["form", "http2", "json", "rustls-no-provider", "stream", "system-proxy"] }
regex = "1.13.1"
rusqlite = { version = "=0.40.2", default-features = false, features = ["backup", "hooks", "limits", "bundled-sqlcipher-vendored-openssl"] }
# Xana does not require AWS-LC's FIPS or post-quantum extensions, so select
# Rustls's smaller built-in provider without its CMake-based build dependency.
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rpassword = "7.5.4"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
tachyonfx = { version = "0.25.1", default-features = false, features = ["std"] }
rustyline = { version = "18.0.1", default-features = false }
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
shlex = "1.3.0"
tar = { version = "0.4.44", default-features = false }
tokio = { version = "1.48.0", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
toml = "1.1.4"
toml_edit = "0.25.13"
uuid = { version = "1.18.1", features = ["serde", "v4", "v5"] }
unicode-width = "0.2.2"
zeroize = { version = "=1.8.2", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "=1.1.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
portable-pty = "=0.9.0"
tempfile = "3.27.0"
tokio = { version = "1.48.0", features = ["test-util"] }
vt100 = "=0.16.2"

# `cargo-dist` requires a named profile; no settings override Cargo's existing
# release profile for the developer preview.
[profile.dist]
inherits = "release"
