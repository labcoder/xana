[package]
name = "xana"
version = "0.1.0"
edition = "2024"
description = "A small, extensible personal AI agent harness written in Rust"
license = "MIT"
repository = "https://github.com/labcoder/xana"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
reqwest = { version = "0.13.4", features = ["blocking", "json", "rustls"] }
rustyline = "18.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"
