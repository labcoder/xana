[package]
name = "xana"
version = "0.1.0"
edition = "2024"
description = "A small, extensible personal AI agent harness written in Rust"
license = "MIT"
repository = "https://github.com/labcoder/xana"
readme = "README.md"

[dependencies]
anstream = "1.0.0"
anyhow = "1.0.104"
blake3 = "1.8.3"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
futures = "0.3.31"
reqwest = { version = "0.13.4", features = ["json", "rustls", "stream"] }
rustyline = "18.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.48.0", features = ["io-util", "macros", "process", "rt-multi-thread", "sync"] }
toml = "1.1.4"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.27.0"
