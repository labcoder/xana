[workspace]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/labcoder/xana"

[package]
name = "xana"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A small, extensible personal AI agent harness written in Rust"
license = "MIT"
repository = "https://github.com/labcoder/xana"
readme = "README.md"
keywords = ["ai", "agent", "cli", "automation"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[package.metadata.dist]
# Prebuilt archives are an explicit product path even though crates.io
# publication remains disabled.
dist = true

[features]
default = ["documents-csv"]
documents-csv = ["dep:csv"]

[[bin]]
name = "xana"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false }
atomic-write-file = "0.3.0"
base64 = "0.22.1"
blake3 = "1.8.3"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
csv = { version = "1.4.0", optional = true }
directories = "6.0.0"
futures = "0.3.31"
keyring = "4.1.6"
reqwest = { version = "0.13.4", features = ["json", "rustls", "stream"] }
rpassword = "7.5.4"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
rustyline = "18.0.1"
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
toml = "1.1.4"
toml_edit = "0.25.13"
uuid = { version = "1.18.1", features = ["serde", "v4", "v5"] }
unicode-width = "0.2.2"
zeroize = { version = "=1.8.2", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"

# `cargo-dist` requires a named profile; no settings override Cargo's existing
# release profile for the developer preview.
[profile.dist]
inherits = "release"
