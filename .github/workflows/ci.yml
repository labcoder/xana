name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt, clippy

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run all-feature workspace tests
        run: cargo test --workspace --all-targets --all-features

      - name: Run no-default-feature workspace tests
        run: cargo test --workspace --all-targets --no-default-features

      - name: Audit package contents
        shell: pwsh
        run: ./scripts/check-package-contents.ps1

      - name: Verify Bash installer behavior
        shell: bash
        run: |
          bash ./scripts/test-install-sh.sh
          bash ./scripts/test-release-sha256.sh

      - name: Verify PowerShell installer behavior
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install-ps1.ps1

      - name: Verify release workflow and bundle assembly
        shell: pwsh
        run: |
          ./scripts/check-release-workflow.ps1
          ./scripts/test-release-ci-evidence.ps1
          ./scripts/test-create-release-draft.ps1
          ./scripts/test-release-archive-contract.ps1
          ./scripts/test-release-bundle.ps1

      - name: Verify installation documentation and removal
        shell: pwsh
        run: |
          ./scripts/check-installation-docs.ps1
          ./scripts/test-removal-recipes.ps1

      - name: Verify packageable application
        run: cargo package --package xana --locked

      - name: Install pinned release planner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          installer="$(mktemp)"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh \
            --output "$installer"
          bash ./scripts/verify-sha256.sh "$installer" \
            b657cf8c04a8b7bc28f39d220f7e6dd11bbd2bdb072c552262bd9ccf597261b5
          sh "$installer"
          rm -f -- "$installer"

      - name: Verify Release Preview plan
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./scripts/check-release-plan.ps1
