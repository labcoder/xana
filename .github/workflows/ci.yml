name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / Ubuntu 24.04
            runner: ubuntu-24.04
            test_args: ""
          - name: macOS / 15 ARM64
            runner: macos-15
            test_args: ""
          - name: Windows / Server 2025
            runner: windows-2025
            test_args: "-- --test-threads=4"

    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned Rust
        id: rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt, clippy

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Prepare reviewed native storage builder
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: ./scripts/prepare-storage-build.ps1

      - name: Install Linux Desktop build dependencies
        id: desktop-deps
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libfontconfig1-dev

      - name: Report execution environment
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.rust.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/report-ci-environment.ps1

      - name: Check formatting
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.rust.outcome == 'success' }}
        run: cargo fmt --all --check

      - name: Run Clippy
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.rust.outcome == 'success' && (runner.os != 'Linux' || steps.desktop-deps.outcome == 'success') }}
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Verify Desktop dependency boundary
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.rust.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/check-desktop-dependencies.ps1

      - name: Run all-feature workspace tests
        if: ${{ !cancelled() && runner.os != 'Linux' && steps.checkout.outcome == 'success' && steps.rust.outcome == 'success' }}
        run: cargo test --locked --workspace --all-targets --all-features ${{ matrix.test_args }}

      - name: Run no-default-feature workspace tests
        if: ${{ !cancelled() && runner.os != 'Linux' && steps.checkout.outcome == 'success' && steps.rust.outcome == 'success' }}
        run: cargo test --locked --workspace --all-targets --no-default-features ${{ matrix.test_args }}

      - name: Check Linux workspace test targets
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.checkout.outcome == 'success' && steps.rust.outcome == 'success' && steps.desktop-deps.outcome == 'success' }}
        run: |
          cargo check --locked --workspace --all-targets --all-features
          cargo check --locked --workspace --all-targets --no-default-features

      - name: Run Linux integration tests
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.checkout.outcome == 'success' && steps.rust.outcome == 'success' }}
        run: |
          cargo test --locked --test cli --test settings_cli --test encrypted_storage_contract --all-features
          cargo test --locked --test cli --test settings_cli --test encrypted_storage_contract --no-default-features

      - name: Stress MCP stdio lifecycle
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.checkout.outcome == 'success' && steps.rust.outcome == 'success' }}
        run: >-
          cargo test --locked --lib --all-features
          mcp::stdio::tests::stdio_lifecycle_is_stable_under_repetition --
          --ignored --exact

      - name: Audit package contents
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.rust.outcome == 'success' }}
        shell: pwsh
        run: |
          ./scripts/check-package-contents.ps1
          ./scripts/test-package-contents.ps1

      - name: Verify Bash installer behavior
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.rust.outcome == 'success' }}
        shell: bash
        run: |
          bash ./scripts/test-install-sh.sh
          bash ./scripts/test-release-sha256.sh

      - name: Verify PowerShell installer behavior
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.checkout.outcome == 'success' && steps.rust.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/test-install-ps1.ps1

      - name: Verify release workflow and bundle assembly
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.rust.outcome == 'success' }}
        shell: pwsh
        run: |
          ./scripts/check-release-workflow.ps1
          ./scripts/test-release-ci-evidence.ps1
          ./scripts/test-create-release-draft.ps1
          ./scripts/test-release-archive-contract.ps1
          ./scripts/test-release-bundle.ps1

      - name: Verify installation documentation and removal
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.rust.outcome == 'success' }}
        shell: pwsh
        run: |
          ./scripts/check-installation-docs.ps1
          ./scripts/test-removal-recipes.ps1

      - name: Verify locked source installation
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.rust.outcome == 'success' }}
        shell: pwsh
        run: |
          cargo install --path . --locked --debug --root '${{ runner.temp }}/xana-source-install'
          if ($LASTEXITCODE -ne 0) { throw 'locked source installation failed' }

      - name: Install pinned release planner
        id: dist
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.checkout.outcome == 'success' && steps.rust.outcome == 'success' }}
        shell: bash
        run: bash ./scripts/install-cargo-dist.sh

      - name: Verify Release Preview plan
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.checkout.outcome == 'success' && steps.rust.outcome == 'success' && steps.dist.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/check-release-plan.ps1

  desktop-macos-intel:
    name: Desktop / macOS 15 Intel
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: clippy

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: desktop-macos-intel
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build and test Desktop source target
        run: |
          cargo build --locked -p xana-desktop
          cargo test --locked -p xana-desktop
