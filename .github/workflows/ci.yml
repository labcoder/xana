name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run all-feature workspace tests
        run: cargo test --workspace --all-targets --all-features

      - name: Run no-default-feature workspace tests
        run: cargo test --workspace --all-targets --no-default-features

      - name: Audit package contents
        shell: pwsh
        run: ./scripts/check-package-contents.ps1

      - name: Verify packageable source crate
        run: cargo package --package xana-core --locked

      - name: Install pinned release planner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          installer="$(mktemp)"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh \
            --output "$installer"
          echo "b657cf8c04a8b7bc28f39d220f7e6dd11bbd2bdb072c552262bd9ccf597261b5  $installer" | sha256sum --check
          sh "$installer"
          rm -f -- "$installer"

      - name: Verify Release Preview plan
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./scripts/check-release-plan.ps1
