name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run all-feature workspace tests
        run: cargo test --workspace --all-targets --all-features

      - name: Run no-default-feature workspace tests
        run: cargo test --workspace --all-targets --no-default-features

      - name: Audit package contents
        shell: pwsh
        run: ./scripts/check-package-contents.ps1

      - name: Verify packageable source crate
        run: cargo package --package xana-core --locked
