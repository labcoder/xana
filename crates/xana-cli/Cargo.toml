[package]
name = "xana-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Installed Xana command-line executable"

[features]
default = ["documents-csv"]
documents-csv = ["xana-runtime/documents-csv"]

[[bin]]
name = "xana"
path = "src/main.rs"

[dependencies]
xana-runtime = { version = "0.5.0", path = "../..", default-features = false }
